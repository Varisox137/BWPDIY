[project]
name = "bwpdiy"
version = "0.5.0"
description = "《阴阳师百闻牌》DIY 卡牌工具：渲染核心库 + 式神项目制卡牌库 + WebGUI 编辑器"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.22.3",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bwpdiy"]
artifacts = ["bwpdiy/render/default_layout.json"]
