<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>BWPDIY 日志运维</title>
  <link rel="stylesheet" href="/log-admin.css">
  <script src="/log-admin.js" defer></script>
</head>
<body>
<main>
  <h1>BWPDIY 日志运维</h1>
  <p class="note">只读查看和下载服务端运行日志。提取码位于服务端 logs/.log-access-token，每 10 分钟轮换；本页不会保存提取码。</p>
  <div class="connect">
    <label for="token">提取码</label>
    <input id="token" type="password" autocomplete="off" inputmode="text" autofocus>
    <button id="connect">连接并刷新</button>
  </div>
  <p id="status" role="status">请输入当前提取码</p>
  <div class="workspace">
    <section>
      <h2>运行日志</h2>
      <select id="logs" size="10" aria-label="日志列表" disabled></select>
      <button id="download" disabled>下载所选完整日志</button>
    </section>
    <section>
      <h2>日志预览 <span id="preview-note"></span></h2>
      <pre id="preview">尚未选择日志</pre>
    </section>
  </div>
</main>
</body>
</html>
