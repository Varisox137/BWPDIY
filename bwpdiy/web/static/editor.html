<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>BWPDIY 编辑器</title>
<style>
  body { margin: 0; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }
  #topnav { display: flex; align-items: center; background: #26221c; padding: 6px 10px; }
  #topnav .brand { color: #d9b96a; font-weight: bold; margin-right: 16px; }
  .navtab { padding: 4px 14px; margin-right: 6px; cursor: pointer; border: 1px solid #999; background: #fff; }
  .navtab.active { background: #d9b96a; }
  .tabpage { display: none; flex: 1; min-height: 0; }
  .tabpage.active { display: flex; }

  /* ---- 卡牌库 tab ---- */
  #c-left { width: 250px; padding: 8px; overflow-y: auto; background: #f3efe8; box-sizing: border-box; }
  #c-mid { flex: 1; display: flex; flex-direction: column; align-items: center; background: #3a3a3a; padding-top: 8px; }
  #c-right { width: 300px; padding: 8px; overflow-y: auto; background: #f3efe8; box-sizing: border-box; }
  #c-preview { margin-top: 10px; background: #222; width: 512px; height: 512px; }
  .item { padding: 3px 6px; cursor: pointer; }
  .item.active { background: #d9b96a; }
  .item.shiki { font-weight: bold; }
  .item.shiki::after { content: "（式神）"; font-weight: normal; font-size: 11px; color: #8a6d1f; }
  .btnrow { margin: 4px 0 10px; }
  .btnrow button { margin: 2px 4px 2px 0; font-size: 12px; }
  #c-status { color: #ffd77a; margin-left: 8px; }
  #c-error { color: #ff9a9a; font-size: 12px; max-width: 512px; white-space: pre-line; margin-top: 4px; }
  #c-list-error { color: #c0392b; font-size: 12px; white-space: pre-line; margin-top: 6px; }
  #c-ask { border: 1px solid #999; background: #fffbe9; padding: 6px; margin-top: 6px; display: none; font-size: 12px; }
  #c-ask input, #c-ask select { width: 100%; margin: 4px 0; box-sizing: border-box; }
  #c-form label { display: block; font-size: 12px; margin-top: 8px; }
  #c-form input[type="text"], #c-form input[type="number"] { width: 150px; }
  #c-form textarea { width: 100%; height: 110px; font-size: 12px; box-sizing: border-box; }
  #c-form .readonly { color: #666; font-size: 12px; margin-top: 4px; }
  #c-form-errors { color: #c0392b; font-size: 12px; white-space: pre-line; margin-top: 8px; }
  #c-dirty { color: #a00; font-size: 12px; margin-left: 8px; }

  /* ---- 布局设置 tab（沿用原 layout.html 样式约定） ---- */
  #l-sidebar, #l-props { width: 220px; padding: 8px; overflow-y: auto; background: #f3efe8; box-sizing: border-box; }
  #l-main { flex: 1; display: flex; flex-direction: column; align-items: center; background: #3a3a3a; }
  #l-main button { margin: 4px; }
  #l-preview { margin-top: 12px; cursor: crosshair; background: #222; }
  .tab { padding: 4px 10px; margin: 2px; cursor: pointer; border: 1px solid #999; background: #fff; }
  .tab.active { background: #d9b96a; }
  #l-props label { display: block; font-size: 12px; margin-top: 6px; }
  #l-props input, #l-props select { width: 90px; }
  #l-cardprops label { display: block; font-size: 12px; margin-top: 4px; }
  #l-cardprops input { width: 100px; }
  #l-cardprops textarea { width: 195px; height: 64px; font-size: 12px; }
  .note { font-size: 11px; color: #777; }
  #l-status { color: #ffd77a; margin-left: 8px; }
</style>
</head>
<body>
<nav id="topnav">
  <span class="brand">BWPDIY</span>
  <button class="navtab active" data-tab="cards">卡牌库</button>
  <button class="navtab" data-tab="layout">布局设置</button>
</nav>

<div id="tab-cards" class="tabpage active">
  <div id="c-left">
    <h4>项目</h4>
    <div id="c-projects"></div>
    <div class="btnrow">
      <button id="c-new-proj">新建</button><button id="c-ren-proj">重命名</button><button id="c-del-proj">删除</button>
    </div>
    <h4>卡牌</h4>
    <div id="c-cards"></div>
    <div class="btnrow">
      <button id="c-new-card">新建</button><button id="c-ren-card">重命名</button><button id="c-del-card">删除</button>
    </div>
    <div id="c-ask"></div>
    <div id="c-list-error"></div>
  </div>
  <div id="c-mid">
    <div>
      <button id="c-btn-refresh">强制刷新</button>
      <span id="c-status"></span>
    </div>
    <div id="c-error"></div>
    <img id="c-preview" width="512" height="512" alt="">
  </div>
  <div id="c-right">
    <div id="c-form">未选中卡牌</div>
  </div>
</div>

<div id="tab-layout" class="tabpage">
  <div id="l-sidebar">
    <div id="l-types"></div>
    <h4>卡牌内容</h4><div id="l-cardprops"></div>
    <h4>元素</h4><div id="l-elems"></div>
    <h4>文本区</h4><div id="l-regions"></div>
  </div>
  <div id="l-main">
    <div>
      <button id="l-btn-preview">强制刷新</button>
      <button id="l-btn-save">保存</button>
      <span id="l-status"></span>
    </div>
    <canvas id="l-preview" width="512" height="512"></canvas>
  </div>
  <div id="l-props"></div>
</div>

<script>
// ================= 共享常量与工具 =================
const TYPES = ["式神", "战斗", "法术", "形态", "幻境", "协战"];
const FACTIONS = ["红莲", "苍叶", "青岚", "紫岩", "无相"];
const RARITIES = ["N", "R", "SR", "SSR"];
const LEVELS = [1, 2, 3];
// stat 字段口径与 store/schema.py 对齐：式神/形态 power+health、幻境 durability 非负；
// 战斗 power+/shield+、觉醒法术 power+/health+ 可负；协战无 stat
const STATS_BY_TYPE = {
  "式神": ["power", "health"], "战斗": ["power+", "shield+"], "法术": ["power+", "health+"],
  "形态": ["power", "health"], "幻境": ["durability"], "协战": [],
};
const SIGNED_STATS = ["power+", "shield+", "health+"];
// stat 适用矩阵（与 badges.py _STAT_MATRIX 同口径）：type -> {field: 输入框标签}
// 表外组合不提供输入框也不绘制；法术仅觉醒（evolve）有 stat；式神/形态/幻境强制非负
const STAT_MATRIX = {
  "式神": {"power": "力量", "health": "生命"},
  "战斗": {"power+": "力量+", "shield+": "护甲+"},
  "法术": {"power+": "力量+", "health+": "生命+"},
  "形态": {"power": "力量", "health": "生命"},
  "幻境": {"durability": "耐久"},
};
const NONNEG_TYPES = new Set(["式神", "形态", "幻境"]);
// 觉醒（evolve）仅战斗/法术/形态/幻境；式神/协战不提供勾选框（与 store schema 同口径）
const EVOLVE_TYPES = new Set(["战斗", "法术", "形态", "幻境"]);

let layouts = null;          // 完整布局 dict（/api/layout），两 tab 共享
let samples = null;          // 六类型样卡字段（/api/samples），布局 tab 用

async function ensureLayouts() {
  if (!layouts) layouts = await (await fetch('/api/layout')).json();
  return layouts;
}
function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }
function enc(s) { return encodeURIComponent(s); }
// 422 detail 三结构兼容：StoreError→字符串、SchemaError→中文错误列表、
// FastAPI body 校验→pydantic dict 列表（取 loc+msg）；统一返回消息数组
async function parseErrorDetail(r) {
  let d;
  try { d = (await r.json()).detail; } catch (e) { return ['HTTP ' + r.status]; }
  if (typeof d === 'string') return [d];
  if (Array.isArray(d)) return d.map(e => {
    if (typeof e === 'string') return e;
    if (e && e.msg) return `${(e.loc || []).join('.')}：${e.msg}`;
    return JSON.stringify(e);
  });
  return [JSON.stringify(d)];
}

// ================= 顶部 tab 导航 =================
function showTab(name) {
  document.querySelectorAll('.navtab').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === name));
  document.getElementById('tab-cards').classList.toggle('active', name === 'cards');
  document.getElementById('tab-layout').classList.toggle('active', name === 'layout');
  history.replaceState(null, '', name === 'layout' ? '#layout' : '#cards');
  if (name === 'layout') layoutBoot();  // 布局 tab 懒初始化（首次进入才拉取样卡/渲染预览）
}
document.querySelectorAll('.navtab').forEach(b => b.onclick = () => showTab(b.dataset.tab));

// ================= 卡牌库 tab =================
let projects = [];
let curProject = null;
let cards = [];
let curCard = null;
let cardData = null;   // 服务端已保存内容
let formData = null;   // 编辑副本（保存前不落盘）
let cDirty = false;
const cStatusEl = document.getElementById('c-status');
const cErrorEl = document.getElementById('c-error');
const cPreviewImg = document.getElementById('c-preview');
let cPreviewTimer = null;
let cPreviewSeq = 0;   // 预览请求序号：旧响应到达时丢弃，避免乱序覆盖新图
let cPreviewUrl = null;  // 当前预览 objectURL：换图时释放上一张，防内存累积
let selectSeq = 0;     // 选卡请求序号：快速连点时慢响应不得覆盖新卡表单

function listErr(msgs) {
  document.getElementById('c-list-error').textContent = (msgs || []).join('\n');
}
function showFormErrors(msgs) {
  const el = document.getElementById('c-form-errors');
  if (el) el.textContent = (msgs || []).join('\n');
}
function confirmDiscard() {
  return !cDirty || confirm('当前卡牌有未保存修改，切换将丢弃，继续？');
}

// ---- 项目列表 ----
async function loadProjects(selectCardName = null) {
  let r;
  try { r = await fetch('/api/projects'); } catch (e) { listErr(['项目列表请求失败: ' + e]); return; }
  projects = await r.json();
  if (!projects.includes(curProject)) curProject = null;
  buildProjectList();
  if (curProject) await loadCards(selectCardName);
  else { cards = []; buildCardList(); clearCard(); }
}
function buildProjectList() {
  const div = document.getElementById('c-projects');
  div.innerHTML = '';
  for (const p of projects) {
    const d = document.createElement('div');
    d.textContent = p;
    d.className = 'item' + (p === curProject ? ' active' : '');
    d.onclick = () => selectProject(p);
    div.appendChild(d);
  }
}
async function selectProject(p) {
  if (p === curProject || !confirmDiscard()) return;
  cDirty = false;
  curProject = p;
  listErr([]);
  buildProjectList();
  await loadCards();
}

// ---- 卡牌列表 ----
async function loadCards(selectName = null) {
  let r;
  try { r = await fetch(`/api/projects/${enc(curProject)}/cards`); }
  catch (e) { listErr(['卡牌列表请求失败: ' + e]); return; }
  if (!r.ok) { cards = []; buildCardList(); clearCard(); listErr(await parseErrorDetail(r)); return; }
  cards = await r.json();
  buildCardList();
  const target = selectName && cards.includes(selectName) ? selectName : cards[0];
  if (target) await selectCard(target, true);
  else clearCard();
}
function buildCardList() {
  const div = document.getElementById('c-cards');
  div.innerHTML = '';
  for (const c of cards) {
    const d = document.createElement('div');
    d.textContent = c;
    d.className = 'item' + (c === 'shikigami' ? ' shiki' : '') + (c === curCard ? ' active' : '');
    d.onclick = () => selectCard(c);
    div.appendChild(d);
  }
}
async function selectCard(name, force = false) {
  if (!force && (name === curCard || !confirmDiscard())) return;
  curCard = name;
  buildCardList();
  listErr([]);
  cStatusEl.textContent = '';
  const seq = ++selectSeq;
  let r;
  try { r = await fetch(`/api/projects/${enc(curProject)}/cards/${enc(name)}`); }
  catch (e) { if (seq === selectSeq) { clearCard(); listErr(['卡牌读取请求失败: ' + e]); } return; }
  if (seq !== selectSeq) return;  // 期间又选了别的卡，丢弃本次慢响应
  if (!r.ok) { clearCard(); listErr(await parseErrorDetail(r)); return; }
  cardData = await r.json();
  formData = deepCopy(cardData);
  cDirty = false;
  buildForm();
  cPreviewProject();
}
function clearCard() {
  curCard = null; cardData = null; formData = null; cDirty = false;
  document.getElementById('c-form').textContent = '未选中卡牌';
  cPreviewImg.removeAttribute('src');
  if (cPreviewUrl) { URL.revokeObjectURL(cPreviewUrl); cPreviewUrl = null; }
  cErrorEl.textContent = '';
}

// ---- 项目/卡牌操作（新建/重命名/删除） ----
// 通用内联输入条：标题 + 可选下拉 + 文本框，确定/取消
function ask({title, value = '', options = null}) {
  return new Promise(resolve => {
    const box = document.getElementById('c-ask');
    box.innerHTML = '';
    box.style.display = 'block';
    const t = document.createElement('div');
    t.textContent = title;
    box.appendChild(t);
    let sel = null;
    if (options) {
      sel = document.createElement('select');
      for (const o of options) {
        const op = document.createElement('option');
        op.value = op.textContent = o;
        sel.appendChild(op);
      }
      box.appendChild(sel);
    }
    const input = document.createElement('input');
    input.type = 'text'; input.value = value;
    box.appendChild(input);
    const row = document.createElement('div');
    const ok = document.createElement('button'); ok.textContent = '确定';
    const cancel = document.createElement('button'); cancel.textContent = '取消';
    row.appendChild(ok); row.appendChild(cancel);
    box.appendChild(row);
    input.focus(); input.select();
    const done = v => { box.style.display = 'none'; box.innerHTML = ''; resolve(v); };
    ok.onclick = () => done({text: input.value, sel: sel ? sel.value : null});
    cancel.onclick = () => done(null);
    input.onkeydown = ev => {
      if (ev.key === 'Enter') ok.click();
      if (ev.key === 'Escape') cancel.click();
    };
  });
}

document.getElementById('c-new-proj').onclick = async () => {
  const r = await ask({title: '新项目名'});
  if (!r || !r.text) return;
  const resp = await fetch('/api/projects', {method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name: r.text})});
  if (!resp.ok) { listErr(await parseErrorDetail(resp)); return; }
  curProject = r.text; cDirty = false;
  listErr([]);
  await loadProjects();
};
document.getElementById('c-ren-proj').onclick = async () => {
  if (!curProject) { listErr(['请先选择项目']); return; }
  const r = await ask({title: `重命名项目「${curProject}」为`, value: curProject});
  if (!r || !r.text || r.text === curProject) return;
  if (cDirty && !confirm('当前卡牌有未保存修改，项目重命名后将丢弃，继续？')) return;
  const resp = await fetch(`/api/projects/${enc(curProject)}`, {method: 'PUT',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify({new_name: r.text})});
  if (!resp.ok) { listErr(await parseErrorDetail(resp)); return; }
  const keep = curCard;  // 重命名后保持当前卡选中（loadCards 缺省会跳第一张卡）
  curProject = r.text; cDirty = false;
  listErr([]);
  await loadProjects(keep);
};
document.getElementById('c-del-proj').onclick = async () => {
  if (!curProject) { listErr(['请先选择项目']); return; }
  if (!confirm(`删除项目「${curProject}」及其全部卡牌？`)) return;
  const resp = await fetch(`/api/projects/${enc(curProject)}`, {method: 'DELETE'});
  if (!resp.ok) { listErr(await parseErrorDetail(resp)); return; }
  curProject = null; cDirty = false;
  listErr([]);
  await loadProjects();
};

// 新卡骨架：类型创建时定死（cards/ 下不允许式神；式神卡随项目出厂）
function skeleton(type, name, project) {
  const c = {type, name, level: 1, rarity: 'R', description: ''};
  if (type !== '协战') c.shikigami = project;
  if (type === '战斗') { c['power+'] = 0; c['shield+'] = 0; }
  if (type === '形态') { c.power = 1; c.health = 1; }
  if (type === '幻境') c.durability = 1;
  return c;
}
document.getElementById('c-new-card').onclick = async () => {
  if (!curProject) { listErr(['请先选择项目']); return; }
  const r = await ask({title: '新卡名（下方选择类型）', options: ['战斗', '法术', '形态', '幻境', '协战']});
  if (!r || !r.text) return;
  const resp = await fetch(`/api/projects/${enc(curProject)}/cards/${enc(r.text)}`, {method: 'PUT',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify(skeleton(r.sel, r.text, curProject))});
  if (!resp.ok) { listErr(await parseErrorDetail(resp)); return; }
  listErr([]);
  await loadCards(r.text);
};
document.getElementById('c-ren-card').onclick = async () => {
  if (!curCard) { listErr(['请先选择卡牌']); return; }
  if (curCard === 'shikigami') { listErr(['式神卡（shikigami）不可重命名']); return; }
  const r = await ask({title: `重命名卡牌「${curCard}」为`, value: curCard});
  if (!r || !r.text || r.text === curCard) return;
  if (cDirty && !confirm('当前卡牌有未保存修改，将随改名一并保存到新卡，继续？')) return;
  // 后端无卡牌改名接口：以当前表单内容改名另存新卡，再删旧卡。
  // 先 PUT 后 DELETE：任何一步失败旧卡数据都不丢（DELETE 失败仅新旧并存，可手动善后）
  const oldName = curCard;
  const data = deepCopy(formData);
  data.name = r.text;
  const put = await fetch(`/api/projects/${enc(curProject)}/cards/${enc(r.text)}`, {method: 'PUT',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)});
  if (!put.ok) { listErr(await parseErrorDetail(put)); return; }
  const del = await fetch(`/api/projects/${enc(curProject)}/cards/${enc(oldName)}`, {method: 'DELETE'});
  if (!del.ok) {
    cDirty = false; curCard = r.text;
    await loadCards(r.text);  // 新卡已落盘：刷新列表露出并存状态，便于手动善后
    listErr([`新卡「${r.text}」已创建，但旧卡「${oldName}」删除失败（两卡并存，请手动处理）：`,
             ...(await parseErrorDetail(del))]);
    return;
  }
  cDirty = false; curCard = r.text;
  listErr([]);
  await loadCards(r.text);
};
document.getElementById('c-del-card').onclick = async () => {
  if (!curCard) { listErr(['请先选择卡牌']); return; }
  if (curCard === 'shikigami') { listErr(['式神卡（shikigami）不可删除，可覆盖保存']); return; }
  if (!confirm(`删除卡牌「${curCard}」？`)) return;
  const resp = await fetch(`/api/projects/${enc(curProject)}/cards/${enc(curCard)}`, {method: 'DELETE'});
  if (!resp.ok) { listErr(await parseErrorDetail(resp)); return; }
  cDirty = false; curCard = null;
  listErr([]);
  await loadCards();
};

// ---- 中栏预览：防抖 + 序号防乱序；选中/保存后走项目卡预览（含项目卡图），编辑期走样卡管线 ----
function scheduleCardPreview() {
  clearTimeout(cPreviewTimer);
  cPreviewTimer = setTimeout(cPreviewForm, 300);
}
async function cHandlePreviewResponse(r, seq) {
  if (seq !== cPreviewSeq) return;  // 期间又有新调整，丢弃本次结果
  if (!r.ok) {
    cErrorEl.textContent = '预览失败：' + (await parseErrorDetail(r)).join('\n');
    return;
  }
  cErrorEl.textContent = '';
  const blob = await r.blob();
  const url = URL.createObjectURL(blob);
  const prev = cPreviewUrl;
  cPreviewUrl = url;
  cPreviewImg.onload = () => { if (prev) URL.revokeObjectURL(prev); };  // 新图加载成功才释放旧图
  cPreviewImg.src = url;
}
async function cPreviewProject() {
  if (!curProject || !curCard) return;
  const seq = ++cPreviewSeq;
  let r;
  try {
    r = await fetch(`/api/projects/${enc(curProject)}/cards/${enc(curCard)}/preview`, {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'});
  } catch (e) {
    if (seq === cPreviewSeq) cErrorEl.textContent = '预览请求失败: ' + e;
    return;
  }
  await cHandlePreviewResponse(r, seq);
}
async function cPreviewForm() {
  if (!formData) return;
  if (validateCardJS(formData).length) return;  // 表单校验未过：不刷预览（错误已在表单侧显示）
  const seq = ++cPreviewSeq;
  let r;
  try {
    await ensureLayouts();
    const tl = layouts[formData.type];
    if (!tl) return;
    const cardOverride = deepCopy(formData);
    delete cardOverride.artwork;  // 项目卡图路径基准与样卡管线不同，编辑期预览用占位底图
    r = await fetch('/api/preview', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type: formData.type, layout: tl, card: cardOverride})});
  } catch (e) {
    if (seq === cPreviewSeq) cErrorEl.textContent = '预览请求失败: ' + e;
    return;
  }
  await cHandlePreviewResponse(r, seq);
}
document.getElementById('c-btn-refresh').onclick = () => {
  if (cDirty) scheduleCardPreview();  // 有未保存修改时刷新编辑态预览，避免被已保存内容覆盖
  else cPreviewProject();
};

// ---- 右栏卡牌表单：按类型动态显隐字段，即时校验 + 防抖预览 ----
function buildForm() {
  const div = document.getElementById('c-form');
  div.innerHTML = '';
  if (!formData) { div.textContent = '未选中卡牌'; return; }
  const t = formData.type;
  // 类型创建时定死；卡名与文件名一致（改名走左栏「重命名」）
  infoRow(div, '类型', t);
  infoRow(div, '卡名', formData.name ?? curCard);
  if (t === '式神') {
    selRowC(div, '派系', FACTIONS, formData.faction ?? '红莲', v => setField('faction', v));
  } else {
    selRowC(div, '等级', ['1', '2', '3'], String(formData.level ?? 1), v => setField('level', parseInt(v, 10)));
    selRowC(div, '稀有度', RARITIES, formData.rarity ?? 'R', v => setField('rarity', v));
    if (EVOLVE_TYPES.has(t)) {
      checkRowC(div, '觉醒', !!formData.evolve, v => {
        formData.evolve = v;
        if (t === '法术' && !v) { delete formData['power+']; delete formData['health+']; }  // 非觉醒法术不可携带数值
        afterEdit(true);
      });
    }
    textRow(div, '式神名', formData.shikigami ?? '', v => setOptText('shikigami', v));
    textRow(div, '子类型', formData.special_type ?? '', v => setOptText('special_type', v));
  }
  // stat 数值按矩阵（法术仅觉醒；式神/形态/幻境强制非负，滚轮微调同布局页交互）
  if (t !== '法术' || !!formData.evolve) {
    const nonneg = NONNEG_TYPES.has(t);
    for (const f of STATS_BY_TYPE[t] || []) {
      numRowC(div, STAT_MATRIX[t][f], formData[f] ?? 0, nonneg, v => setField(f, v));
    }
  }
  const l = document.createElement('label');
  l.textContent = '描述 ';
  const ta = document.createElement('textarea');
  ta.value = formData.description ?? '';
  ta.onchange = () => {
    ta.value = ta.value.replace(/\n+/g, '\n').replace(/^\n|\n$/g, '');  // 连续换行合并为一个
    setField('description', ta.value);
  };
  l.appendChild(ta); div.appendChild(l);
  const row = document.createElement('div');
  row.style.marginTop = '10px';
  const btn = document.createElement('button');
  btn.textContent = '保存';
  btn.onclick = saveCard;
  const dirty = document.createElement('span');
  dirty.id = 'c-dirty';
  dirty.textContent = cDirty ? '● 未保存' : '';
  row.appendChild(btn); row.appendChild(dirty);
  div.appendChild(row);
  const errs = document.createElement('div');
  errs.id = 'c-form-errors';
  div.appendChild(errs);
  showFormErrors(validateCardJS(formData));
}
function infoRow(div, label, val) {
  const d = document.createElement('div');
  d.className = 'readonly';
  d.textContent = `${label}：${val}`;
  div.appendChild(d);
}
function setField(k, v) { formData[k] = v; afterEdit(); }
function setOptText(k, v) {  // 可选字符串字段：清空即删键（不给服务端送空串）
  if (v === '') delete formData[k]; else formData[k] = v;
  afterEdit();
}
function afterEdit(rebuild = false) {
  cDirty = true;
  if (rebuild) buildForm();  // evolve 切换影响 stat 输入区显隐，整表重建
  else {
    const d = document.getElementById('c-dirty');

}
function numRowC(div, label, val, nonneg, set) {
  const l = document.createElement('label');
  l.textContent = label + ' ';
  const i = document.createElement('input');
  i.type = 'number'; i.value = val;
  if (nonneg) i.min = 0;
  let cur = val;
  const commit = () => {
    let v = parseInt(i.value, 10);
    if (isNaN(v)) { i.value = cur; return; }
    if (nonneg) v = Math.max(0, v);
    i.value = v; cur = v; set(v);
  };
  i.onchange = commit;
  i.onwheel = ev => {  // 滚轮微调
    ev.preventDefault();
    i.value = (parseInt(i.value, 10) || 0) + (ev.deltaY < 0 ? 1 : -1);
    commit();

}
function selRowC(div, label, opts, val, set) {

    const op = document.createElement('option');
    op.value = op.textContent = o;
    if (o === val) op.selected = true;
    s.appendChild(op);

  s.onchange = () => set(s.value);
  l.appendChild(s); div.appendChild(l);

function checkRowC(div, label, val, set) {

// 即时校验：口径对齐 store/schema.py validate_card（artwork 由服务端把最后一道）
function validateCardJS(d) {
  const errors = [];
  const t = d.type;
  if (!TYPES.includes(t)) return [`字段 type：非法卡牌类型「${t}」，须为 ${TYPES.join('/')} 之一`];
  if (typeof d.name !== 'string' || !d.name.trim()) errors.push('字段 name：必填且必须是非空字符串');
  const allowed = new Set(['type', 'name', 'description', 'artwork']);
  if (t === '式神') ['faction', ...STATS_BY_TYPE['式神']].forEach(f => allowed.add(f));
  else {
    ['level', 'rarity', 'shikigami', 'special_type', ...STATS_BY_TYPE[t]].forEach(f => allowed.add(f));
    if (EVOLVE_TYPES.has(t)) allowed.add('evolve');
  }
  for (const k of Object.keys(d)) {
    if (!allowed.has(k)) errors.push(`字段 ${k}：类型「${t}」白名单之外的字段`);
  }
  if (t === '式神') {
    for (const f of ['faction', ...STATS_BY_TYPE['式神']]) {
      if (!(f in d)) errors.push(`缺少必填字段：${f}`);
    }
    if ('faction' in d && !FACTIONS.includes(d.faction)) {
      errors.push(`字段 faction：非法派系「${d.faction}」，须为 ${FACTIONS.join('/')} 之一`);
    }
    if ('description' in d && typeof d.description !== 'string') errors.push('字段 description：必须是字符串');
  } else {
    if (!('rarity' in d)) errors.push('缺少必填字段：rarity');
    else if (!RARITIES.includes(d.rarity)) {
      errors.push(`字段 rarity：非法稀有度「${d.rarity}」，须为 ${RARITIES.join('/')} 之一`);
    }
    if ('level' in d && (!Number.isInteger(d.level) || !LEVELS.includes(d.level))) {
      errors.push(`字段 level：等级必须是整数 ${LEVELS.join('/')} 之一`);
    }
    if ('evolve' in d && typeof d.evolve !== 'boolean') errors.push('字段 evolve：必须是布尔值（true/false）');
    for (const f of ['shikigami', 'special_type', 'description']) {
      if (f in d && typeof d[f] !== 'string') errors.push(`字段 ${f}：必须是字符串`);
    }
  }
  const evolve = !!d.evolve;
  for (const f of STATS_BY_TYPE[t]) {
    if (!(f in d)) continue;
    if (t === '法术' && !evolve) { errors.push(`字段 ${f}：仅觉醒法术牌（evolve: true）可携带数值`); continue; }
    if (!Number.isInteger(d[f])) errors.push(`字段 ${f}：必须是整数`);
    else if (!SIGNED_STATS.includes(f) && d[f] < 0) errors.push(`字段 ${f}：必须是非负整数`);
  }
  return errors;
}

// ---- 保存：422 错误按三结构解析显示在表单侧 ----
async function saveCard() {
  const errs = validateCardJS(formData);
  if (errs.length) { showFormErrors(errs); return; }
  let r;
  try {
    r = await fetch(`/api/projects/${enc(curProject)}/cards/${enc(curCard)}`, {method: 'PUT',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(formData)});
  } catch (e) { showFormErrors(['保存请求失败: ' + e]); return; }
  if (!r.ok) { showFormErrors(await parseErrorDetail(r)); return; }
  cardData = deepCopy(formData);
  cDirty = false;
  const d = document.getElementById('c-dirty');
  if (d) d.textContent = '';
  showFormErrors([]);
  cStatusEl.textContent = '已保存';
  cPreviewProject();  // 落盘后再走项目卡预览，取回项目卡图
}

// ================= 布局设置 tab =================
// 自原 static/layout.html 迁入：DOM id 加 l- 前缀、入口改懒初始化 layoutBoot、
// 列表选择器限定 #l-sidebar 作用域；函数名/常量名保持原样（tests/test_web.py 的 node 抽取测试依赖）
// stat 图标仅限存在 _l 大图变体的资源（sj 只有 _s，渲染 stat 用 _l，选 sj 会预览失败）
const ICONS = ['ll', 'sm', 'hj', 'nj', 'pj', 'zl', 'fl', 'nl'];
const FONTS = ['name', 'desc'];
// 内部标识 → 界面中文显示名（未收录原样显示；图标码语义见 docs/terminology.md 内嵌图标段）
const DISP = {
  // 布局元素名 / 文本区名 / 字体键
  level: '等级标', faction: '派系标', rarity: '稀有度', power: '力量', health: '生命',
  shield: '护甲', durability: '耐久', name: '卡名', footer: '脚注', desc: '描述',
  // 元素 kind
  stat: '数值', rarity_flank: '稀有度双标', level_badge: '等级标', text: '文本',

};
function disp(k) { return DISP[k] || k; }
// stat 输入框从当前类型布局的 stat 元素 field 派生（不硬编码 field），再按矩阵过滤
function statInputs() {
  const allowed = STAT_MATRIX[curType] || {};
  if (curType === "法术" && !cardField('evolve')) return [];  // 非觉醒法术无 stat
  const inputs = [];
  for (const e of Object.values(typeLayout().elements)) {

}
let cardOverrides = {};      // type -> {field: value} 卡牌内容覆盖（POST /api/preview 的 card）
let curType = "战斗";
let sel = null;              // {kind:'element'|'region', name}
let dirty = false;
const canvas = document.getElementById('l-preview');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('l-status');
let previewImg = null;     // 预览图（/api/preview 传 crop=False，恒为完整 512×512，与布局坐标 1:1）

// 懒初始化：首次进入布局 tab 才拉取布局/样卡并渲染（卡牌库 tab 不白付预览开销）
let layoutInited = false;
async function layoutBoot() {
  if (layoutInited) return;
  layoutInited = true;
  try {
    await ensureLayouts();
    samples = await (await fetch('/api/samples')).json();
  } catch (e) {
    layoutInited = false;
    statusEl.textContent = '布局加载失败: ' + e;
    return;
  }
  buildTypes(); selectType('战斗');
}
function typeLayout() { return layouts[curType]; }
function markDirty() { dirty = true; }
// 当前类型卡牌内容：样卡字段 + 用户覆盖（覆盖优先；不改的不传，后端深拷贝合并）
function cardField(name) {
  const ov = cardOverrides[curType] || {};
  return name in ov ? ov[name] : (samples[curType] || {})[name];
}
function setCardField(name, value) {
  (cardOverrides[curType] = cardOverrides[curType] || {})[name] = value;
  schedulePreview();
}

// 实时预览：任何调整后防抖 300ms 自动刷新（拖拽 mousemove 不走这里，mouseup 直接刷）
let previewTimer = null;
let previewSeq = 0;  // 请求序号：旧响应到达时丢弃，避免乱序覆盖新图
function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(refreshPreview, 300);
}

// 尺寸类字段跨类型同步：同名元素在所有类型间保持一致（pos 与内容类字段不同步）
function syncElemField(name, key, val) {
  for (const t of TYPES) {
    const el = layouts[t] && layouts[t].elements && layouts[t].elements[name];
    if (el && key in el) el[key] = val;
  }
}
function syncRegionField(name, key, val) {
  for (const t of TYPES) {
    const r = layouts[t] && layouts[t].text_regions && layouts[t].text_regions[name];
    if (r && key in r) r[key] = val;
  }
}

// 类型 tab
function buildTypes() {
  const div = document.getElementById('l-types');
  div.innerHTML = '';
  for (const t of TYPES) {
    const b = document.createElement('button');
    b.textContent = t; b.className = 'tab';
    b.onclick = () => selectType(t);
    div.appendChild(b);
  }
}
function selectType(t) {
  curType = t; sel = null; previewImg = null;  // 清旧图，避免与新类型覆盖层短暂共存
  document.querySelectorAll('#l-types .tab').forEach(b =>
    b.classList.toggle('active', b.textContent === t));
  buildLists(); buildCardProps(); buildProps(); refreshPreview();
}

// 卡牌内容输入（预览数据可编辑；改动走防抖实时预览，不涉及布局保存）
function buildCardProps() {
  const div = document.getElementById('l-cardprops');
  div.innerHTML = '';
  if (!samples || !samples[curType]) return;
  const nonneg = NONNEG_TYPES.has(curType);  // 式神/形态/幻境 stat 强制非负
  for (const [field, label] of statInputs()) {
    const l = document.createElement('label');
    l.textContent = label + ' ';
    const i = document.createElement('input');
    i.type = 'number'; i.value = cardField(field) ?? 0;
    if (nonneg) i.min = 0;
    const commit = () => {
      let v = parseInt(i.value, 10);
      if (isNaN(v)) { i.value = cardField(field) ?? 0; return; }
      if (nonneg) v = Math.max(0, v);
      i.value = v; setCardField(field, v);
    };
    i.onchange = commit;
    i.onwheel = ev => {  // 滚轮微调
      ev.preventDefault();
      i.value = (parseInt(i.value, 10) || 0) + (ev.deltaY < 0 ? 1 : -1);
      commit();
    };
    l.appendChild(i); div.appendChild(l);
  }
  if (EVOLVE_TYPES.has(curType)) {
    const l = document.createElement('label');
    l.textContent = '觉醒 ';
    const i = document.createElement('input');
    i.type = 'checkbox'; i.checked = !!cardField('evolve');
    i.onchange = () => { setCardField('evolve', i.checked); buildCardProps(); };  // 法术 stat 输入随觉醒显隐
    l.appendChild(i); div.appendChild(l);
  }
  if ('shikigami' in samples[curType]) {
    textRow(div, '式神名', cardField('shikigami') || '', v => setCardField('shikigami', v));
  }
  textRow(div, '子类型', cardField('special_type') || '', v => setCardField('special_type', v));
  const l = document.createElement('label');
  l.textContent = '描述 ';
  const ta = document.createElement('textarea');
  ta.value = cardField('description') || '';
  ta.onchange = () => {
    ta.value = ta.value.replace(/\n+/g, '\n').replace(/^\n|\n$/g, '');  // 连续换行合并为一个
    setCardField('description', ta.value);
  };
  l.appendChild(ta); div.appendChild(l);
}
function textRow(div, label, val, set) {
  const l = document.createElement('label');
  l.textContent = label + ' ';
  const i = document.createElement('input');
  i.type = 'text'; i.value = val;
  i.onchange = () => set(i.value);
  l.appendChild(i); div.appendChild(l);
}

// 左栏列表（显示中文名，内部键存 dataset.key 供选中高亮比对）
function buildLists() {
  const tl = typeLayout();
  const ed = document.getElementById('l-elems'); ed.innerHTML = '';
  for (const name of Object.keys(tl.elements)) {
    const d = document.createElement('div');
    d.textContent = disp(name); d.className = 'item'; d.dataset.key = name;
    d.onclick = () => { sel = {kind: 'element', name}; refreshSel(); };
    ed.appendChild(d);
  }
  const rd = document.getElementById('l-regions'); rd.innerHTML = '';
  for (const name of Object.keys(tl.text_regions)) {
    const d = document.createElement('div');
    d.textContent = disp(name); d.className = 'item'; d.dataset.key = name;
    d.onclick = () => { sel = {kind: 'region', name}; refreshSel(); };
    rd.appendChild(d);

}
function refreshSel() {
  document.querySelectorAll('#l-sidebar .item').forEach(d =>
    d.classList.toggle('active', sel && d.dataset.key === sel.name));
  buildProps(); draw();
}

// 预览
async function refreshPreview() {
  const seq = ++previewSeq;
  let r;
  try {
    const body = {type: curType, layout: typeLayout()};
    if (cardOverrides[curType] && Object.keys(cardOverrides[curType]).length)
      body.card = cardOverrides[curType];
    r = await fetch('/api/preview', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
  } catch (e) {
    if (seq !== previewSeq) return;  // 过期请求的失败文案不得覆盖新状态
    statusEl.textContent = '预览请求失败: ' + e;
    return;
  }
  if (seq !== previewSeq) return;  // 期间又有新调整，丢弃本次结果
  if (!r.ok) {
    statusEl.textContent = '预览失败: ' + (await r.json()).detail;
    return;
  }
  statusEl.textContent = dirty ? '● 未保存' : '';
  const blob = await r.blob();
  const img = new Image();
  img.onload = () => {
    if (seq !== previewSeq) { URL.revokeObjectURL(img.src); return; }
    previewImg = img; draw(); URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(blob);
}

// 画布绘制：预览图恒 512×512 直接 1:1 绘制 + 覆盖层
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (previewImg) ctx.drawImage(previewImg, 0, 0);
  const tl = typeLayout();
  for (const [name, e] of Object.entries(tl.elements)) {
    handle(e.pos, sel && sel.name === name ? '#ff4' : '#0ff');
    if (e.kind === 'stat') {
      const np = [e.pos[0] + e.num_offset[0], e.pos[1] + e.num_offset[1]];
      handle(np, sel && sel.name === name ? '#ff4' : '#f8f', 5, true);
    }
  }
  for (const [name, r] of Object.entries(tl.text_regions)) {
    const active = sel && sel.name === name;
    ctx.strokeStyle = active ? '#ff4' : '#4f4';
    ctx.strokeRect(r.center[0] - r.width / 2, r.center[1] - r.height / 2, r.width, r.height);
    handle(r.center, active ? '#ff4' : '#4f4', 5, true);
  }
}
function handle([x, y], color, s = 6, square = false) {
  ctx.fillStyle = color;
  if (square) ctx.fillRect(x - s / 2, y - s / 2, s, s);
  else { ctx.beginPath(); ctx.arc(x, y, s, 0, 7); ctx.fill(); }
}

// 拖拽（mouseup/mousemove 挂 window，拖出画布不丢）
let drag = null;
canvas.addEventListener('mousedown', ev => {
  const [mx, my] = mousePos(ev);
  drag = pick(mx, my);
  if (drag) { sel = drag.sel; refreshSel(); }
});
window.addEventListener('mousemove', ev => {
  if (!drag) return;
  const [mx, my] = mousePos(ev);
  drag.set(clamp(mx), clamp(my));
  markDirty(); buildProps(); draw();
});
window.addEventListener('mouseup', () => { if (drag) { drag = null; refreshPreview(); } });
function clamp(v) { return Math.max(0, Math.min(511, Math.round(v))); }
function mousePos(ev) {
  const r = canvas.getBoundingClientRect();
  return [ev.clientX - r.left, ev.clientY - r.top];
}
function pick(mx, my) {
  const tl = typeLayout();
  const near = (x, y) => Math.hypot(mx - x, my - y) < 8;
  for (const [name, e] of Object.entries(tl.elements)) {
    if (e.kind === 'stat') {
      const np = [e.pos[0] + e.num_offset[0], e.pos[1] + e.num_offset[1]];
      if (near(...np)) return { sel: {kind: 'element', name},
        // num_offset 是尺寸类字段：拖拽数字锚点同样跨类型广播（与属性面板 num_dx/num_dy 一致）
        set: (x, y) => { e.num_offset = [x - e.pos[0], y - e.pos[1]];
          syncElemField(name, 'num_offset', [...e.num_offset]); } };
    }
    if (near(...e.pos)) return { sel: {kind: 'element', name}, set: (x, y) => { e.pos = [x, y]; } };
  }
  for (const [name, r] of Object.entries(tl.text_regions)) {
    if (near(...r.center)) return { sel: {kind: 'region', name},
      set: (x, y) => { r.center = [x, y]; } };
  }
  return null;
}

// 右栏属性面板（标签全中文；disp 映射内部标识）
function buildProps() {
  const div = document.getElementById('l-props');
  div.innerHTML = '';
  if (!sel) { div.textContent = '点击元素/文本区以编辑'; return; }
  const tl = typeLayout();
  if (sel.kind === 'element') {
    const e = tl.elements[sel.name];
    div.appendChild(title(e.kind === 'stat'
      ? `${disp(sel.name)}（数值：${disp(e.field)}）`
      : `${disp(sel.name)}（${disp(e.kind)}）`));
    numRow(div, '位置 x', e.pos[0], v => { e.pos[0] = v; draw(); });
    numRow(div, '位置 y', e.pos[1], v => { e.pos[1] = v; draw(); });
    if (e.kind === 'stat') {
      numRow(div, '图标尺寸', e.icon_size, v => { e.icon_size = v; syncElemField(sel.name, 'icon_size', v); });
      numRow(div, '数字偏移 x', e.num_offset[0], v => { e.num_offset[0] = v; syncElemField(sel.name, 'num_offset', [...e.num_offset]); draw(); });
      numRow(div, '数字偏移 y', e.num_offset[1], v => { e.num_offset[1] = v; syncElemField(sel.name, 'num_offset', [...e.num_offset]); draw(); });
      numRow(div, '字号', e.font_size, v => { e.font_size = v; syncElemField(sel.name, 'font_size', v); });
      if (e.icon_neg) {
        // 战斗护甲：按当前值自动选贴图（值<0 用破甲 pj，否则护甲 hj），不提供手动选择
        const n = document.createElement('div');
        n.className = 'note';
        n.textContent = `图标按数值自动选择：${disp(e.icon)}/${disp(e.icon_neg)}`;
        div.appendChild(n);
      } else {
        selRow(div, '图标', ICONS, e.icon, v => e.icon = v, disp);
      }
    }
    if (e.kind === 'rarity_flank') {
      numRow(div, '默认间距', e.gap, v => { e.gap = v; syncElemField(sel.name, 'gap', v); });
      numRow(div, '卡名间距', e.margin ?? 8, v => { e.margin = v; syncElemField(sel.name, 'margin', v); });
      numRow(div, '尺寸', e.size, v => { e.size = v; syncElemField(sel.name, 'size', v); });
    }
    if (e.kind === 'faction') {
      numRow(div, '尺寸', e.size, v => { e.size = v; syncElemField(sel.name, 'size', v); });
      selRow(div, '样式', ['1', '2', '3'], String(e.style || 2), v => e.style = parseInt(v, 10));
    }
    if (e.kind === 'level_badge') {
      // per-type 开关，不跨类型同步；协战按需求不提供开关（等价始终启用）
      if (curType !== '协战') checkRow(div, '启用', e.enabled !== false, v => e.enabled = v);
      numRow(div, '底座尺寸', e.base_size, v => { e.base_size = v; syncElemField(sel.name, 'base_size', v); });
      numRow(div, '星标尺寸', e.star_size, v => { e.star_size = v; syncElemField(sel.name, 'star_size', v); });
      numRow(div, '数字尺寸', e.num_size, v => { e.num_size = v; syncElemField(sel.name, 'num_size', v); });
    }
    if (e.kind === 'text') {
      numRow(div, '字号', e.font_size, v => { e.font_size = v; syncElemField(sel.name, 'font_size', v); });
      selRow(div, '字体', FONTS, e.font || 'name', v => e.font = v, disp);
    }
  } else {
    const r = tl.text_regions[sel.name];
    div.appendChild(title(`${disp(sel.name)} 文本区`));
    numRow(div, '中心 x', r.center[0], v => { r.center[0] = v; draw(); });
    numRow(div, '中心 y', r.center[1], v => { r.center[1] = v; draw(); });
    numRow(div, '宽度', r.width, v => { r.width = v; syncRegionField(sel.name, 'width', v); draw(); });
    numRow(div, '高度', r.height, v => { r.height = v; syncRegionField(sel.name, 'height', v); draw(); });
    numRow(div, '字号上限', r.font_range[0], v => { r.font_range[0] = v; syncRegionField(sel.name, 'font_range', [...r.font_range]); });
    numRow(div, '字号下限', r.font_range[1], v => { r.font_range[1] = v; syncRegionField(sel.name, 'font_range', [...r.font_range]); });
    checkRow(div, '自动换行', r.wrap, v => r.wrap = v);
    selRow(div, '字体', FONTS, r.font, v => r.font = v, disp);
  }
}
function title(t) { const h = document.createElement('h4'); h.textContent = t; return h; }
function numRow(div, label, val, set) {
  const l = document.createElement('label');
  l.textContent = label + ' ';
  const i = document.createElement('input');
  i.type = 'number'; i.value = val;
  i.onchange = () => { const v = parseInt(i.value, 10); if (isNaN(v)) { i.value = val; return; } markDirty(); set(v); schedulePreview(); };
  l.appendChild(i); div.appendChild(l);
}
function checkRow(div, label, val, set) {
  const l = document.createElement('label');
  l.textContent = label + ' ';
  const i = document.createElement('input');
  i.type = 'checkbox'; i.checked = val;
  i.onchange = () => { markDirty(); set(i.checked); schedulePreview(); };
  l.appendChild(i); div.appendChild(l);
}
function selRow(div, label, opts, val, set, map = null) {
  const l = document.createElement('label');
  l.textContent = label + ' ';
  const s = document.createElement('select');
  for (const o of opts) {
    const op = document.createElement('option');
    op.value = o;
    op.textContent = map ? map(o) : o;  // map：内部值 → 中文显示名（值保持内部键不变）
    if (o === val) op.selected = true;
    s.appendChild(op);
  }
  s.onchange = () => { markDirty(); set(s.value); schedulePreview(); };
  l.appendChild(s); div.appendChild(l);
}

// 保存时以当前类型为准传播：同名元素的样式键镜像到所有类型（缺键不删、各自保留）。
// 内容/结构键（kind/field/icon/icon_neg/pos/enabled）一律不镜像——field 曾被跨类型覆盖
// 造成数据污染（式神/形态 power→power+、法术 health+→health），只同步白名单内样式键。
// 编辑期 syncElemField 调用点同样只传样式键（num_offset/icon_size/font_size/gap/margin/
// size/base_size/star_size/num_size），与本能保持同口径。
const STYLE_KEYS = new Set(["size", "icon_size", "font_size", "num_offset", "gap",
                            "margin", "base_size", "star_size", "num_size", "font", "style"]);
function propagateFromCurrentType() {
  const cur = typeLayout().elements || {};
  for (const [name, el] of Object.entries(cur)) {
    for (const t of TYPES) {
      if (t === curType) continue;
      const other = layouts[t] && layouts[t].elements && layouts[t].elements[name];
      if (!other) continue;
      for (const k of STYLE_KEYS) {
        if (k in el) other[k] = JSON.parse(JSON.stringify(el[k]));
      }
    }
  }
}

// 保存
document.getElementById('l-btn-save').onclick = async () => {
  propagateFromCurrentType();
  let r;
  try {
    r = await fetch('/api/layout', {method: 'PUT',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(layouts)});
  } catch (e) {
    statusEl.textContent = '保存请求失败: ' + e;
    return;
  }
  if (r.ok) { dirty = false; statusEl.textContent = '已保存'; }
  else statusEl.textContent = '保存失败: ' + (await r.json()).detail;
};
document.getElementById('l-btn-preview').onclick = refreshPreview;

// ================= 入口 =================
fetch('/api/version').then(r => r.json()).then(v => {
  document.title += ' v' + v.version;
  document.querySelector('#topnav .brand').textContent += ' v' + v.version;
}).catch(() => {});
loadProjects();
if (location.hash === '#layout') showTab('layout');  // /layout 重定向落点
</script>
