<h1>BWPDIY 布局配置工具</h1>
<p>前端界面待后续里程碑实现。当前可用 API：</p>
<ul>
  <li><code>GET /api/layout</code> — 读取当前布局配置</li>
  <li><code>PUT /api/layout</code> — 写回布局配置</li>
  <li><code>POST /api/preview</code> — 按提交布局渲染样卡预览（PNG）</li>
</ul>
</body>
